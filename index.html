:root{--bg:#0b0805;--gold:#d4af37;--ivory:#eadfc6;--glow:rgba(212,175,55,.16);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(ellipse at 50% 55%,var(--glow),transparent 62%),var(--bg);color:var(--ivory);font-family:'Jost',sans-serif;font-weight:300;transition:background .8s}
#scroller{height:480vh;height:480dvh}
#stage{position:fixed;inset:0;pointer-events:none;touch-action:auto}
#stage.on{pointer-events:auto;touch-action:none;cursor:grab}
canvas{display:block;width:100%;height:100%}
.ov{position:fixed;left:0;right:0;padding:0 7vw;pointer-events:none;opacity:0;transition:opacity .5s}
.ov.show{opacity:1}
h1,h2,h3{font-family:'Cormorant Garamond',serif;font-weight:400;color:var(--gold)}
h1{font-style:italic;font-size:clamp(2.6rem,9vw,6.4rem);line-height:1}
.hero{top:9vh;text-align:center}
.hero p{margin-top:1rem;letter-spacing:.2em;font-size:.8rem}
.hint{bottom:7vh;text-align:center;font-size:.8rem;letter-spacing:.15em}
.concept{top:14vh;max-width:560px;font-family:'Cormorant Garamond',serif;font-size:clamp(1.3rem,3.4vw,2rem);line-height:1.35}
.concept b{font-weight:600;color:var(--gold)}
.choose{bottom:6vh;text-align:center}
.choose h2{font-style:italic;font-size:clamp(1.6rem,4vw,2.4rem);margin-bottom:.9rem}
.btns{display:flex;gap:.7rem;justify-content:center;flex-wrap:wrap}
button{pointer-events:auto;font:inherit;cursor:pointer;background:rgba(11,8,5,.6);color:var(--gold);border:1px solid var(--gold);padding:.7rem 1.4rem;font-size:1rem;letter-spacing:.08em;transition:background .25s,color .25s}
button:hover,button:focus-visible{background:var(--gold);color:#0b0805;outline:none}
#panel{position:fixed;right:6vw;top:50%;transform:translateY(-50%);width:min(380px,88vw);opacity:0;pointer-events:none;transition:opacity .6s .3s}
#panel.show{opacity:1}
#panel h2{font-style:italic;font-size:3.4rem;line-height:1}
#panel .sub{margin:.4rem 0 1.2rem;letter-spacing:.14em;font-size:.82rem;color:var(--gold)}
#panel p{line-height:1.65;margin-bottom:.9rem}
#panel .meta{font-size:.9rem;opacity:.85}
#panel button{margin-top:.8rem}
.credit{position:fixed;bottom:8px;left:0;right:0;text-align:center;font-size:.65rem;opacity:.35;pointer-events:none}
#loader{position:fixed;inset:0;height:100dvh;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9;transition:opacity 1s}
#loader span{font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--gold);font-size:2rem}
@media(max-width:800px){
#panel{right:auto;left:0;top:auto;bottom:0;transform:none;width:100%;padding:3.2rem 7vw calc(1.4rem + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,rgba(11,8,5,.96) 55%,rgba(11,8,5,0));max-height:52dvh}
#panel h2{font-size:2.5rem}#panel .sub{margin:.3rem 0 .7rem;font-size:.75rem}
#panel p{font-size:.92rem;line-height:1.5;margin-bottom:.4rem}#panel .meta{font-size:.82rem}
#panel button{width:100%;min-height:46px;margin-top:.6rem}
.hero{top:calc(8dvh + env(safe-area-inset-top,0px))}.hero p{font-size:.7rem}
.hint{bottom:calc(6dvh + env(safe-area-inset-bottom,0px));font-size:.72rem}
.concept{top:calc(11dvh + env(safe-area-inset-top,0px));font-size:1.35rem}
.choose{bottom:calc(5dvh + env(safe-area-inset-bottom,0px))}
.btns button{flex:1 1 28%;min-height:48px;padding:.6rem .4rem}
.credit{display:none}}
@media(max-width:800px) and (orientation:landscape){#panel{max-height:70dvh;width:50%;left:auto;right:0;background:rgba(11,8,5,.85)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

 s.lineTo(x+r,y+h);s.quadraticCurveTo(x,y+h,x,y+h-r);s.lineTo(x,y+r);s.quadraticCurveTo(x,y,x+r,y);return s}
// bottle body: rounded box, exact outer size w*h*d
function rbox(w,h,d,r,b,seg){const g=new THREE.ExtrudeGeometry(roundedShape(w-2*b,h-2*b,Math.max(r-b,.01)),{depth:d-2*b,bevelEnabled:true,bevelThickness:b,bevelSize:b,bevelSegments:seg||4,curveSegments:10});g.translate(0,0,-(d-2*b)/2);return g}
// leather box parts: rounded slab standing on y=0, optional rounded hole, outer size exact
function shell(wO,dO,rO,H,b,hole){
 const sh=roundedShape(wO-2*b,dO-2*b,Math.max(rO-b,.01));
 if(hole)sh.holes.push(roundedShape(hole.w+2*b,hole.d+2*b,hole.r+b));
 const g=new THREE.ExtrudeGeometry(sh,{depth:H-2*b,bevelEnabled:true,bevelThickness:b,bevelSize:b,bevelSegments:4,curveSegments:14});
 g.rotateX(-Math.PI/2);g.translate(0,b,0);return g}

function drawGlyph(c,k,x,y,s,col){c.save();c.translate(x,y);c.scale(s,s);c.strokeStyle=c.fillStyle=col||'#d4af37';c.lineWidth=3;c.lineCap='round';
 if(k==='eros'){c.beginPath();c.moveTo(0,10);c.bezierCurveTo(-26,-8,-12,-26,0,-10);c.bezierCurveTo(12,-26,26,-8,0,10);c.fill();c.beginPath();c.moveTo(-18,34);c.quadraticCurveTo(-30,14,-14,8);c.moveTo(18,34);c.quadraticCurveTo(30,14,14,8);c.moveTo(-18,34);c.lineTo(18,34);c.stroke()}
 if(k==='ares'){c.beginPath();c.moveTo(0,-30);c.lineTo(0,34);c.moveTo(-14,-4);c.lineTo(14,-4);c.stroke();c.beginPath();c.arc(0,-33,3,0,7);c.fill()}
 if(k==='apollo'){c.beginPath();c.moveTo(-24,28);c.lineTo(24,-24);c.stroke();c.beginPath();c.moveTo(24,-24);c.lineTo(10,-22);c.lineTo(22,-10);c.fill();c.beginPath();c.moveTo(-24,28);c.lineTo(-30,18);c.moveTo(-24,28);c.lineTo(-14,32);c.moveTo(-17,22);c.lineTo(-23,12);c.moveTo(-17,22);c.lineTo(-7,26);c.stroke()}
 c.restore()}

// ---------- pebbled leather (procedural, tileable): colour + normal + roughness ----------
function makeLeather(){
 const N=512,C=22;let seed=7;const rnd=()=>((seed=(seed*16807)%2147483647)-1)/2147483646;
 const fx=new Float32Array(C*C),fy=new Float32Array(C*C),fh=new Float32Array(C*C);
 for(let i=0;i<C*C;i++){fx[i]=.15+rnd()*.7;fy[i]=.15+rnd()*.7;fh[i]=rnd()}
 const G=64,lat=new Float32Array(G*G);for(let i=0;i<G*G;i++)lat[i]=rnd();
 const vn=(u,v,f)=>{const x=u*f,y=v*f,i=Math.floor(x),j=Math.floor(y),a=x-i,b=y-j,sa=a*a*(3-2*a),sb=b*b*(3-2*b);
  const L=(p,q)=>lat[((q%G+G)%G)*G+((p%G+G)%G)];
  return (L(i,j)*(1-sa)+L(i+1,j)*sa)*(1-sb)+(L(i,j+1)*(1-sa)+L(i+1,j+1)*sa)*sb};
 const h=new Float32Array(N*N);
 for(let y=0;y<N;y++)for(let x=0;x<N;x++){
  const u=x/N*C,v=y/N*C,ci=Math.floor(u),cj=Math.floor(v);let d1=9,d2=9,id=0;
  for(let dj=-1;dj<=1;dj++)for(let di=-1;di<=1;di++){
   const wi=((ci+di)%C+C)%C,wj=((cj+dj)%C+C)%C,k=wj*C+wi;
   const dx=u-(ci+di+fx[k]),dy=v-(cj+dj+fy[k]),d=Math.sqrt(dx*dx+dy*dy);
   if(d<d1){d2=d1;d1=d;id=k}else if(d<d2)d2=d}
  let e=clamp((d2-d1)*2.8,0,1);e=Math.pow(e,.6);
  const fine=vn(x/N,y/N,32)*.5+vn(x/N,y/N,64)*.35;
  h[y*N+x]=e*(.82+fh[id]*.18)+ (fine-.43)*.22}
 const mk=fn=>{const cv=document.createElement('canvas');cv.width=cv.height=N;const c=cv.getContext('2d'),im=c.createImageData(N,N);
  for(let i=0;i<N*N;i++){const o=fn(i);im.data[i*4]=o[0];im.data[i*4+1]=o[1];im.data[i*4+2]=o[2];im.data[i*4+3]=255}
  c.putImageData(im,0,0);const t=new THREE.CanvasTexture(cv);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=maxAniso;return t};
 const str=4.5;
 const normal=mk(i=>{const x=i%N,y=(i/N)|0;
  const hx=h[y*N+(x+1)%N]-h[y*N+(x-1+N)%N],hy=h[((y+1)%N)*N+x]-h[((y-1+N)%N)*N+x];
  let nx=-hx*str,ny=hy*str,nz=1;const l=Math.hypot(nx,ny,nz);return [(nx/l*.5+.5)*255,(ny/l*.5+.5)*255,(nz/l*.5+.5)*255]});
 const rough=mk(i=>{const v=clamp(.45+.5*(1-clamp(h[i],0,1)),0,1)*255;return [v,v,v]});
 const color=mk(i=>{const e=clamp(h[i],0,1);return [14+e*26,14+e*26,17+e*28]});
 color.encoding=THREE.sRGBEncoding;
 return {normal,rough,color}}
const LT=makeLeather();
const leatherMat=new THREE.MeshPhysicalMaterial({map:LT.color,normalMap:LT.normal,normalScale:new THREE.Vector2(1.25,1.25),roughnessMap:LT.rough,roughness:1,metalness:0,clearcoat:.35,clearcoatRoughness:.4,envMapIntensity:1.15});
const goldMat=new THREE.MeshStandardMaterial({color:0xd4af37,metalness:1,roughness:.2,envMapIntensity:1.7});
const threadMat=new THREE.MeshStandardMaterial({color:0xcaa24a,metalness:.55,roughness:.5,envMapIntensity:1});
const silkMat=new THREE.MeshStandardMaterial({color:0x08080a,roughness:.4,metalness:.1,envMapIntensity:.9});

// ---------- stitching along a rounded rectangle ----------
function stitchRing(parent,w,d,r,y,cz,step){
 const L=2*(w-2*r)+2*(d-2*r)+2*Math.PI*r,n=Math.round(L/step),st=L/n;
 const geo=new THREE.CylinderGeometry(.0065,.0065,.07,6);geo.rotateZ(Math.PI/2);
 const mesh=new THREE.InstancedMesh(geo,threadMat,n),o=new THREE.Object3D();
 const a=w/2-r,b=d/2-r,arc=Math.PI*r/2,segs=[2*a,arc,2*b,arc,2*a,arc,2*b,arc];
 for(let i=0;i<n;i++){
  let s=(i+.5)*st,k=0;while(k<7&&s>segs[k]){s-=segs[k];k++}
  const f=s/segs[k];let x,z,tx,tz,th;
  switch(k){
   case 0:x=-a+2*a*f;z=d/2;tx=1;tz=0;break;
   case 1:th=Math.PI/2-f*Math.PI/2;x=a+r*Math.cos(th);z=b+r*Math.sin(th);tx=Math.sin(th);tz=-Math.cos(th);break;
   case 2:x=w/2;z=b-2*b*f;tx=0;tz=-1;break;
   case 3:th=-f*Math.PI/2;x=a+r*Math.cos(th);z=-b+r*Math.sin(th);tx=Math.sin(th);tz=-Math.cos(th);break;
   case 4:x=a-2*a*f;z=-d/2;tx=-1;tz=0;break;
   case 5:th=-Math.PI/2-f*Math.PI/2;x=-a+r*Math.cos(th);z=-b+r*Math.sin(th);tx=Math.sin(th);tz=-Math.cos(th);break;
   case 6:x=-w/2;z=-b+2*b*f;tx=0;tz=1;break;
   default:th=Math.PI-f*Math.PI/2;x=-a+r*Math.cos(th);z=b+r*Math.sin(th);tx=Math.sin(th);tz=-Math.cos(th)}
  o.position.set(x,y,cz+z);o.rotation.set(0,-Math.atan2(tz,tx),0);o.updateMatrix();mesh.setMatrixAt(i,o.matrix)}
 parent.add(mesh);return mesh}

// ---------- bottle (built entirely in code, real proportions + your labels) ----------
const BW=1,BH=1.4,BD=.6,CAPR=.23,CAPH=.95,NECK=.14,TOTAL=BH+NECK+.06+CAPH;
const capProfile=[[0,0],[CAPR,0],[CAPR,CAPH-.03],[CAPR-.014,CAPH-.01],[CAPR-.04,CAPH],[0,CAPH]].map(p=>new THREE.Vector2(p[0],p[1]));
const capGeo=new THREE.LatheGeometry(capProfile,72);
const bottles=[];
function makeBottle(sc){
 const outer=new THREE.Group(),pivot=new THREE.Group();outer.add(pivot);
 const glass=new THREE.MeshPhysicalMaterial({color:0xdfe9e4,transparent:true,opacity:.24,roughness:.03,metalness:0,clearcoat:1,clearcoatRoughness:.03,envMapIntensity:2.2,side:THREE.DoubleSide,depthWrite:false});
 const body=new THREE.Mesh(rbox(BW,BH,BD,.13,.05),glass);body.position.y=BH/2;body.renderOrder=3;
 const thick=new THREE.Mesh(rbox(BW-.1,.18,BD-.1,.08,.03,2),new THREE.MeshPhysicalMaterial({color:0xcfe3da,transparent:true,opacity:.4,roughness:.05,envMapIntensity:2,depthWrite:false}));thick.position.y=.12;thick.renderOrder=2;
 const liq=new THREE.Mesh(rbox(BW-.2,BH-.36,BD-.2,.1,.03),new THREE.MeshPhysicalMaterial({color:sc.liquid,roughness:.12,transparent:true,opacity:.92,emissive:sc.liquid,emissiveIntensity:.18,envMapIntensity:1.2,clearcoat:1}));liq.position.y=.2+(BH-.36)/2;
 const tex=new THREE.TextureLoader().load(LABELS[sc.id]);tex.encoding=THREE.sRGBEncoding;tex.anisotropy=maxAniso;
 const label=new THREE.Mesh(new THREE.PlaneGeometry(BW*.97,BH*.92),new THREE.MeshStandardMaterial({map:tex,emissive:0xffffff,emissiveMap:tex,emissiveIntensity:.22,roughness:.38,metalness:0,envMapIntensity:.7}));
 label.position.set(0,BH*.48,BD/2+.004);
 const neck=new THREE.Mesh(new THREE.CylinderGeometry(.12,.14,NECK,32),glass);neck.position.y=BH+NECK/2;
 const collar=new THREE.Mesh(new THREE.CylinderGeometry(CAPR,CAPR,.06,64),goldMat);collar.position.y=BH+NECK+.03;
 const cap=new THREE.Mesh(capGeo,goldMat);cap.position.y=BH+NECK+.06;
 [liq,thick,label,neck,collar,cap,body].forEach(m=>{m.userData.root=outer;pivot.add(m)});
 pivot.position.y=-TOTAL/2;
 outer.userData={sc,pivot};return outer}

// ---------- leather gift box ----------
const boxG=new THREE.Group();scene.add(boxG);
const BASEH=1.1;
const base=new THREE.Mesh(shell(4,3,.13,BASEH,.04,{w:3.8,d:2.8,r:.06}),leatherMat);boxG.add(base);
const floor=new THREE.Mesh(new THREE.BoxGeometry(3.9,.1,2.9),new THREE.MeshStandardMaterial({color:0x0a0a0b,roughness:.9}));floor.position.y=.15;boxG.add(floor);
// silk lining (interior kept simple)
const sg=new THREE.PlaneGeometry(3.78,2.78,48,36);sg.rotateX(-Math.PI/2);
const sp=sg.attributes.position;for(let i=0;i<sp.count;i++){const x=sp.getX(i),z=sp.getZ(i);sp.setY(i,Math.sin(x*2.1+z*1.3)*.07+Math.sin(x*5.2-z*3.1)*.03+Math.cos(z*3.7)*.04)}
sg.computeVertexNormals();
const silk=new THREE.Mesh(sg,silkMat);silk.position.y=.6;boxG.add(silk);
// gold band around the rim of the base
const band=new THREE.Mesh(shell(4.018,3.018,.135,.045,.01,{w:3.92,d:2.92,r:.06}),goldMat);band.position.y=.98;boxG.add(band);
// leather stitching on the base walls
stitchRing(boxG,4.014,3.014,.13,.86,0,.085);

// lid, hinged on the back edge
const hinge=new THREE.Group();hinge.position.set(0,BASEH,-1.5);boxG.add(hinge);
const LIDH=.4;
const lid=new THREE.Mesh(shell(4.1,3.1,.14,LIDH,.05),leatherMat);lid.position.set(0,0,1.5);hinge.add(lid);
const lining=new THREE.Mesh(new THREE.PlaneGeometry(3.9,2.9),new THREE.MeshStandardMaterial({color:0x0c0c0e,roughness:.5,metalness:.1,envMapIntensity:.6}));lining.geometry.rotateX(Math.PI/2);lining.position.set(0,-.004,1.5);hinge.add(lining);
stitchRing(hinge,3.86,2.86,.1,LIDH+.003,1.5,.085);   // top
stitchRing(hinge,4.114,3.114,.145,.2,1.5,.085);       // side
// gold foil: frame + emblem on the lid
const foilCv=document.createElement('canvas');foilCv.width=1024;foilCv.height=747;
const foilTex=new THREE.CanvasTexture(foilCv);foilTex.anisotropy=maxAniso;
function drawFoil(){
 const c=foilCv.getContext('2d'),W=1024,H=747;c.fillStyle='#000';c.fillRect(0,0,W,H);
 c.strokeStyle='#fff';c.fillStyle='#fff';
 const rr=(m,lw)=>{c.lineWidth=lw;c.beginPath();c.roundRect?c.roundRect(m,m,W-2*m,H-2*m,26):c.rect(m,m,W-2*m,H-2*m);c.stroke()};
 rr(26,7);rr(46,2.5);
 [[70,70],[W-70,70],[70,H-70],[W-70,H-70]].forEach(p=>{c.save();c.translate(p[0],p[1]);c.rotate(Math.PI/4);c.fillRect(-9,-9,18,18);c.restore()});
 drawGlyph(c,'ares',512,300,4.6,'#fff');drawGlyph(c,'eros',250,310,3.4,'#fff');drawGlyph(c,'apollo',774,310,3.4,'#fff');
 c.lineWidth=2;[[330,300],[694,300]].forEach(p=>{c.beginPath();c.moveTo(p[0]-18,p[1]);c.lineTo(p[0]+18,p[1]);c.stroke()});
 c.font='600 54px "Cormorant Garamond",Georgia,serif';c.textBaseline='middle';
 const t='A SWORD IN A SHEEP',sp=20;let tw=0;for(const ch of t)tw+=c.measureText(ch).width+sp;tw-=sp;
 let x=512-tw/2;for(const ch of t){c.textAlign='left';c.fillText(ch,x,560);x+=c.measureText(ch).width+sp}
 c.lineWidth=2;c.beginPath();c.moveTo(262,620);c.lineTo(762,620);c.stroke();
 foilTex.needsUpdate=true}
drawFoil();if(document.fonts)document.fonts.load('600 54px "Cormorant Garamond"').then(drawFoil);
const foil=new THREE.Mesh(new THREE.PlaneGeometry(3.6,2.628),new THREE.MeshStandardMaterial({color:0xe0b84a,metalness:1,roughness:.26,alphaMap:foilTex,transparent:true,bumpMap:foilTex,bumpScale:2.5,envMapIntensity:1.8,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-2}));
foil.rotation.x=-Math.PI/2;foil.position.set(0,LIDH+.006,1.5);hinge.add(foil);
// leather pull-tab with a gold rivet
const tab=new THREE.Mesh((()=>{const g=new THREE.ExtrudeGeometry(roundedShape(.44,.5,.13),{depth:.012,bevelEnabled:true,bevelThickness:.008,bevelSize:.008,bevelSegments:3,curveSegments:10});return g})(),leatherMat);
tab.position.set(0,.1,3.05+.01);hinge.add(tab);
const rivet=new THREE.Mesh(new THREE.CylinderGeometry(.045,.05,.03,24),goldMat);rivet.rotation.x=Math.PI/2;rivet.position.set(0,.22,3.05+.045);hinge.add(rivet);

SCENTS.forEach(sc=>{const b=makeBottle(sc);b.scale.setScalar(.001);scene.add(b);bottles.push(b)});

// ---------- UI ----------
const btns=$('btns');
SCENTS.forEach((sc,i)=>{const b=document.createElement('button');b.textContent=sc.name;b.onclick=e=>{e.stopPropagation();select(i)};btns.appendChild(b)});
let sel=-1,p=0,ps=0,rotY=0,vel=0,dragging=false,lastX=0,mx=0;
function select(i){
 sel=i;const s=SCENTS[i];
 $('pName').textContent=s.name;$('pSub').textContent=s.sub;$('pDesc').textContent=s.desc;$('pNotes').textContent=s.notes;$('pTool').textContent=s.tool;
 document.documentElement.style.setProperty('--glow',s.glow);
 $('panel').classList.add('show');stage.classList.add('on');document.body.style.overflow='hidden';
 rotY=0;vel=.01;
 ['hero','hint','concept','choose'].forEach(k=>$(k).classList.remove('show'));
}
function deselect(){
 sel=-1;$('panel').classList.remove('show');stage.classList.remove('on');document.body.style.overflow='';
 document.documentElement.style.setProperty('--glow','rgba(212,175,55,.16)');
}
$('back').onclick=deselect;
addEventListener('keydown',e=>{if(e.key==='Escape'&&sel>-1)deselect()});
stage.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;stage.setPointerCapture(e.pointerId);stage.style.cursor='grabbing'});
stage.addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.clientX-lastX;lastX=e.clientX;rotY+=dx*.012;vel=dx*.012});
stage.addEventListener('pointerup',()=>{dragging=false;stage.style.cursor='grab'});
addEventListener('pointermove',e=>{mx=e.clientX/innerWidth-.5});
const ray=new THREE.Raycaster(),v2=new THREE.Vector2();
addEventListener('click',e=>{
 if(sel>-1||p<.85||e.target.closest('button'))return;
 v2.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(v2,camera);
 const hit=ray.intersectObjects(bottles,true)[0];
 if(hit){const r=hit.object.userData.root;select(bottles.indexOf(r))}
});

// ---------- loop ----------
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
const A={p:new THREE.Vector3(0,4.0,7.6),l:new THREE.Vector3(0,1.15,0)},B={p:new THREE.Vector3(0,5.2,6.4),l:new THREE.Vector3(0,1.3,0)};
const dA=A.p.distanceTo(A.l);
const tmp=new THREE.Vector3(),look=new THREE.Vector3(),dir=new THREE.Vector3(),right=new THREE.Vector3();
function show(id,on){$(id).classList.toggle('show',on&&sel<0)}
const SB=.62;
function tick(t){
 requestAnimationFrame(tick);
 const max=Math.max(1,document.documentElement.scrollHeight-innerHeight);
 if(sel<0)p=clamp(scrollY/max,0,1);
 ps+=(p-ps)*.07;
 const cam=ease(clamp(ps/.6,0,1)),openA=ease(clamp((ps-.2)/.3,0,1)),lift=ease(clamp((ps-.5)/.35,0,1));
 const asp=innerWidth/innerHeight,k=asp<1?clamp(5.2/(.63*asp)/dA,1,2.3):1;
 tmp.lerpVectors(A.p,B.p,cam);look.lerpVectors(A.l,B.l,cam);
 tmp.sub(look).multiplyScalar(k).add(look);
 camera.position.copy(tmp);camera.lookAt(look);
 hinge.rotation.x=-openA*1.9;
 boxG.rotation.y=sel<0?Math.sin(t*.0003)*.16*(1-cam)+mx*.22*(1-cam):0;
 camera.getWorldDirection(dir);right.crossVectors(dir,camera.up).normalize();
 const pitch=Math.asin(-dir.y),wide=innerWidth>800,port=innerHeight>innerWidth;
 const L=wide?{d:4.4,r:-1.5,u:0,s:.72}:port?{d:5.0,r:0,u:.85,s:.55}:{d:4.4,r:-1.2,u:0,s:.6};
 bottles.forEach((b,i)=>{
  const u=b.userData,isSel=i===sel;
  const restY=-.5+lift*1.8+TOTAL/2*SB;
  const rest=new THREE.Vector3(u.sc.x,restY,.25);
  let target=rest,s=SB*clamp(openA*3,0,1)+.001,tilt=0;
  if(sel>-1){
   if(isSel){target=camera.position.clone().addScaledVector(dir,L.d).addScaledVector(right,L.r).addScaledVector(camera.up,L.u);s=L.s;tilt=pitch*.5}
   else{s=.001;target=rest.clone().setY(restY-.6)}
  }
  b.position.lerp(target,.09);
  b.scale.setScalar(b.scale.x+(s-b.scale.x)*.09);
  b.visible=b.scale.x>.01;
  b.rotation.x+=(tilt-b.rotation.x)*.1;
  if(isSel){if(!dragging){vel*=.96;if(Math.abs(vel)<.004)vel=.004;rotY+=vel}
   b.rotation.y+=(rotY-b.rotation.y)*.15}
  else{b.rotation.y+=(Math.sin(t*.0006+i)*.25-b.rotation.y)*.05}
 });
 if(sel<0){show('hero',ps<.12);show('hint',ps<.06);show('concept',ps>.22&&ps<.5);show('choose',ps>.88)}
 renderer.render(scene,camera);
}
requestAnimationFrame(tick);
window.__ok=1;setTimeout(()=>{$('loader').style.opacity=0;setTimeout(()=>$('loader').remove(),1000)},900);
</script>
